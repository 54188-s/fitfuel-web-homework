<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitFuel三步交互原型</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1823;color:#edf4fc;font:15px/1.7 "Microsoft YaHei",sans-serif;padding:26px}nav{display:flex;gap:10px;margin-bottom:22px}button,a{font:inherit;border:1px solid #35505a;border-radius:10px;padding:10px 16px;background:#132931;color:#b7cbd6;cursor:pointer;text-decoration:none}button[aria-selected=true]{background:#00ffaa;color:#0b1823;border-color:#00ffaa}h2{font-size:27px;margin:0 0 14px}p{color:#92a5b9;margin:0 0 24px}.number{font:12px monospace;color:#00ffaa;letter-spacing:3px}.panel{animation:enter .35s ease}a{display:inline-block}a:hover{border-color:#00ffaa;color:#00ffaa}[hidden]{display:none}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:500px){body{padding:20px}button{padding:8px 11px;font-size:13px}h2{font-size:23px}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}</style><link rel="stylesheet" href="../css/scrollbars.css"></head><body><nav role="tablist" aria-label="使用步骤"><button id="step-0" role="tab" aria-selected="true" aria-controls="panel-0">01 档案</button><button id="step-1" role="tab" aria-selected="false" aria-controls="panel-1">02 训练</button><button id="step-2" role="tab" aria-selected="false" aria-controls="panel-2">03 饮食</button></nav><section id="panel-0" class="panel" role="tabpanel" aria-labelledby="step-0"><span class="number">KNOW YOUR START</span><h2>了解身体，明确目标。</h2><p>填写身高、体重、年龄与活动水平，建立自己的每日能量与营养目标。</p><a href="body.html" target="_parent">开始设置身体档案 ›</a></section><section id="panel-1" class="panel" role="tabpanel" aria-labelledby="step-1" hidden><span class="number">BUILD YOUR ROUTINE</span><h2>选择动作，完成训练。</h2><p>从动作库中按名称或器械搜索，收藏常练动作并加入自己的计划。</p><a href="training.html" target="_parent">制定今天的训练 ›</a></section><section id="panel-2" class="panel" role="tabpanel" aria-labelledby="step-2" hidden><span class="number">FUEL YOUR PROGRESS</span><h2>记好每餐，查看趋势。</h2><p>搜索110种内置食物或创建自定义食物，按克或按份记录摄入。</p><a href="meals.html" target="_parent">记录今天的一餐 ›</a></section><script>const tabs=[...document.querySelectorAll('[role=tab]')];function select(i){tabs.forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;document.getElementById('panel-'+j).hidden=i!==j})}tabs.forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:2))%3;select(next);tabs[next].focus()}}});select(0)</script></body></html>
